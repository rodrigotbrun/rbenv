# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tassaron/tmux-df'
set -g @plugin "loichyan/tmux-toggle-popup"
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore last session when the tmux server starts
set -g @continuum-restore 'on'

# set -g @plugin 'wfxr/tmux-power'
# set -g @plugin 'wfxr/tmux-net-speed'

# set -g @tmux_power_theme 'coral'
# set -g @tmux_power_show_upload_speed   true
# set -g @tmux_power_show_download_speed true
set -g @tmux_power_show_web_reachable true
set -g @tmux_power_show_user    true
set -g @tmux_power_show_host    false
# set -g @tmux_power_show_session true

unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind H select-layout even-horizontal
bind V select-layout even-vertical

set -g mouse on

set -g @popup-toggle-mode 'force-close'
bind C-a run "#{@popup-toggle} --name scratch -Ed'#{pane_current_path}' -w95% -h95%"

# Status bar must be set before TPM. Continuum injects its auto-save hook
# into status-right when the plugin loads; setting it afterwards wipes that hook.
set-option -g status-style bg=#003366,fg=#FFFFFF
set-option -g status-left "   "
set-option -g status-right "#[fg=#FFD700] #{continuum_status} 󰇄 #(whoami)  "

# Install TPM if missing, then load it (keep this at the bottom of tmux.conf):
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
